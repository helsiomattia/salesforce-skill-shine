<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salesforce Skill Shine | Career Paths & Skills</title>
    <script>
      (function () {
        var base = "/salesforce-skill-shine";
        var path = window.location.pathname;

        if (path.indexOf(base) !== 0) {
          window.location.replace(base + "/");
          return;
        }

        var route = path.slice(base.length) || "/";
        var target = base + "/?redirect=" + encodeURIComponent(route + window.location.search + window.location.hash);
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p>Redirecionando...</p>
  </body>
</html>
